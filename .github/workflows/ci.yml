name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLOCI_STORAGE_MODE: memory
    steps:
      - uses: actions/checkout@v4
      - name: Run cold release gate
        run: scripts/e2e.sh
      - name: Repeat cold release gate
        run: scripts/e2e.sh
      - name: Dump container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: docker compose down -v
